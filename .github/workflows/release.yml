name: Release APK

# Obtainium-friendly: tag v* → signed APK on a GitHub Release.
# APK name: timber-<versionName>-release.apk
#
# Required repo secrets for a keepable signed build (see README):
#   TIMBER_KEYSTORE_BASE64
#   TIMBER_KEYSTORE_PASSWORD
#   TIMBER_KEY_ALIAS
#   TIMBER_KEY_PASSWORD
#
# Without those secrets, the workflow still runs assembleRelease and uploads an
# unsigned APK as a workflow artifact (CI validation only — not for installs you
# plan to keep updating).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 0.1.0). Used only for workflow_dispatch."
        required: true
        type: string
      version_code:
        description: "Integer versionCode (must increase each publish)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#v}"
            # MAJOR*10000 + MINOR*100 + PATCH (e.g. 0.1.0 → 100)
            if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-.].*)?$ ]]; then
              VERSION_CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
            else
              echo "Tag must be vMAJOR.MINOR.PATCH (got: $TAG)" >&2
              exit 1
            fi
          fi
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid versionName: $VERSION_NAME" >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]] || [[ "$VERSION_CODE" -lt 1 ]]; then
            echo "Invalid versionCode: $VERSION_CODE" >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=timber-${VERSION_NAME}-release.apk" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Decode release keystore (if secrets present)
        id: signing
        shell: bash
        env:
          TIMBER_KEYSTORE_BASE64: ${{ secrets.TIMBER_KEYSTORE_BASE64 }}
          TIMBER_KEYSTORE_PASSWORD: ${{ secrets.TIMBER_KEYSTORE_PASSWORD }}
          TIMBER_KEY_ALIAS: ${{ secrets.TIMBER_KEY_ALIAS }}
          TIMBER_KEY_PASSWORD: ${{ secrets.TIMBER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${TIMBER_KEYSTORE_BASE64:-}" && -n "${TIMBER_KEYSTORE_PASSWORD:-}" \
                && -n "${TIMBER_KEY_ALIAS:-}" && -n "${TIMBER_KEY_PASSWORD:-}" ]]; then
            mkdir -p signing
            KEYSTORE_PATH="$GITHUB_WORKSPACE/signing/timber-upload.jks"
            echo "$TIMBER_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets present — building signed APK."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TIMBER_* signing secrets missing. Building unsigned release APK for CI validation only."
          fi

      - name: Assemble release APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          TIMBER_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          TIMBER_KEYSTORE_PASSWORD: ${{ secrets.TIMBER_KEYSTORE_PASSWORD }}
          TIMBER_KEY_ALIAS: ${{ secrets.TIMBER_KEY_ALIAS }}
          TIMBER_KEY_PASSWORD: ${{ secrets.TIMBER_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            --stacktrace

      - name: Package APK artifact
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          DEST="dist/${{ steps.ver.outputs.apk_name }}"
          mkdir -p dist
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"
          # Rough signed vs unsigned hint (v2/v3 blocks usually present when signed)
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$DEST" && echo "signed=true" >> "$GITHUB_OUTPUT" \
              || echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        # Only publish Obtainium-facing Releases when the APK is signed.
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip GitHub Release without signing secrets
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "::warning::No GitHub Release published — TIMBER_* signing secrets are missing. Unsigned APK is available as a workflow artifact for CI validation only. Add secrets before the first keepable Obtainium install."
