name: Debug APK

# Manual debug build for sideload / MIDI logcat diagnosis.
# Artifact: timber-debug.apk (debug-signed; TimberMidi logging enabled).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/java/dev/timber/app/engine/midi/**"
      - ".github/workflows/debug-apk.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          mkdir -p dist
          DEST="dist/timber-debug.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: timber-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
